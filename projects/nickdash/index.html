<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>nickdash</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="terminal">

        <div id="output">
            <p>nickdash v0.1.0</p>
            <p>Type <span class="command">help</span> for available commands.</p>
        </div>

        <div class="input-line">
            <span class="prompt">nick@dash:~$</span>

            <input
                id="command-input"
                type="text"
                autocomplete="off"
                autofocus
            >
        </div>

    </main>

    <script src="terminal.js"></script>

</body>
</html>
